# System fallback taxonomy (Zettelkasten / Forever Notes format).
# This file is used by load_taxonomy() when no config/taxonomy.local.yaml is present.
# The named user-facing template is config/taxonomy.zettelkasten.yaml.
#
# To set up your taxonomy, run:  uv run notes setup
# Or copy the template for your chosen framework:
#   cp config/taxonomy.zettelkasten.yaml config/taxonomy.local.yaml
#   cp config/taxonomy.para.yaml config/taxonomy.local.yaml
#   cp config/taxonomy.gtd.yaml config/taxonomy.local.yaml

taxonomy:
  inbox:
    folder: "[YOUR_INBOX_FOLDER]"          # keep flat

  fleeting:
    folder: "[YOUR_FLEETING_FOLDER]"       # keep flat

  literature:
    folder: "[YOUR_LITERATURE_FOLDER]"
    subfolders: []                         # e.g. ["Health", "Technology", "History"]
    # Strict mode with hub overrides (optional - only needed if auto-derived names are wrong):
    # subfolders:
    #   - name: "Health"
    #     hub_title: "✱ Health"            # defaults to "✱ Health" if omitted
    #     hub_tag: "#health"               # defaults to "#health" if omitted
    #   - name: "Technology"               # hub_title/hub_tag auto-derived

  permanent:
    folder: "[YOUR_PERMANENT_FOLDER]"
    subfolders: []                         # e.g. ["Health", "Writing", "Philosophy"]

  projects:
    folder: "[YOUR_PROJECTS_FOLDER]"
    subfolders: []                         # one subfolder per active project

  areas:
    folder: "[YOUR_AREAS_FOLDER]"
    subfolders: []                         # one subfolder per area of life/work

  resources:
    folder: "[YOUR_RESOURCES_FOLDER]"
    subfolders: []                         # e.g. ["Recipes", "Coding", "Finance"]

  archive:
    folder: "[YOUR_ARCHIVE_FOLDER]"
    subfolders: []                         # mirror of old structure where useful

  review:
    folder: "[YOUR_REVIEW_FOLDER]"         # keep flat
