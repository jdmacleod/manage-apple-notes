# General settings - copy to settings.local.yaml and customize.

# How aggressively discover and classify propose changes to your library.
# "conservative": most notes are already organized; require high confidence before moving
#                 notes outside Inbox/Fleeting; only propose new subfolders with strong evidence
# "standard":     default behavior - classify all notes; anchor to existing taxonomy paths
# "full":         treat the library as raw material; reclassify from scratch
reorganization_mode: "standard"

# Operating mode: "loose" (folders + classification only) or
# "strict" (loose + Forever Notes Hub/Home/tag layer).
# See docs/forever-notes-framework.md for details on strict mode.
# Note: this setting only controls hub/home note generation (notes sync-hubs).
# It has no effect on notes discover, notes draft, or notes classify.
forever_notes_mode: "loose"

# How deep the classifier and discover pass suggest folder nesting.
# "flat"    - top-level category folders only; no subfolders suggested
# "natural" - respect depth already present in your taxonomy (default)
# "deep"    - suggest additional nesting tiers up to max_folder_depth
folder_nesting: "natural"

# When enabled, all taxonomy folders are created inside a single top-level
# container folder rather than at the account root. Leave disabled (the default)
# unless you specifically want this structure - it has no effect on discovery or
# classification, only on where `notes move` places folders in Apple Notes.
#
# When to enable: you want the Apple Notes sidebar to show one "Library" entry
# instead of 8-9 top-level category folders, or your notes are already organised
# this way.
#
# Migration path: do your initial classification run with enabled: false. Once
# notes are in their taxonomy folders, move those folders into the container in
# Apple Notes, then flip enabled: true so subsequent exports and moves use the
# container correctly. The export script strips the container prefix from
# folder_path values so all downstream tools always see taxonomy-relative paths.
toplevel_folder:
  enabled: false         # true = nest all taxonomy folders inside `name` at account root
  name: "Library"        # container folder name (only used when enabled: true)

# LLM provider - choose one of: "anthropic", "ollama", "aws-ollama", "apple"
# Set this single value to switch providers. All other LLM settings (model, batch_size,
# context_size, etc.) are filled automatically from the llm_providers block below.
llm_provider: "apple"

# Override individual values on top of the active provider's defaults (optional).
# llm_overrides:
#   model: "claude-sonnet-4-6"
#   batch_size: 5

# Per-provider defaults - loaded automatically based on llm_provider.
# Edit a provider's block here to change its baseline, or use llm_overrides for
# one-off tweaks without altering the defaults.
llm_providers:
  anthropic:
    model: "claude-opus-4-6"      # any claude-* model identifier
    batch_size: 20                 # notes per API call
    theme_discovery_sample: 50     # notes sampled per batch during notes discover
    theme_discovery_mode: "anchored"  # "anchored" = prefer existing paths; "full" = propose from scratch
    context_size: 8192             # max output tokens per call

  ollama:
    model: "llama3"                # any model tag pulled in your local Ollama (llama3, mistral, etc.)
    batch_size: 10
    theme_discovery_sample: 30
    theme_discovery_mode: "anchored"
    context_size: 4096             # adjust for your local model's context window
    request_timeout: 1200          # seconds; increase for slow hardware

  aws-ollama:
    model: "gpt-oss:20b"          # model pre-pulled on the EC2 instance (see docs/aws-infrastructure.md)
    batch_size: 10
    theme_discovery_sample: 30
    theme_discovery_mode: "anchored"
    context_size: 8192             # recommended for gpt-oss:20b on g5.xlarge (24 GB VRAM)
    request_timeout: 1200

  apple:
    batch_size: 1                  # on-device model has a tight 4096-token context; process one note at a time
    theme_discovery_sample: 20
    theme_discovery_mode: "anchored"
    context_size: 4096
    apple_llm_binary: "swift/apple-llm/.build/release/apple-llm"  # path to compiled Swift bridge

# AWS EC2 Ollama deployment - required by `cd infra && cdk deploy` when using provider: "aws-ollama".
# See docs/aws-infrastructure.md for full prerequisites and setup steps.
# aws.ssh_key_path and aws.allowed_cidr can also be set via AWS_SSH_KEY_PATH and AWS_ALLOWED_CIDR
# in .env - env vars take precedence over settings values.
# aws:
#   region: "us-east-1"
#   instance_type: "g5.xlarge"          # GPU instance; adjust for cost vs performance
#   key_pair_name: "my-aws-key"         # existing EC2 key pair name in target region
#   ssh_key_path: "~/.ssh/my-aws-key.pem"  # or set AWS_SSH_KEY_PATH in .env
#   model: "gpt-oss:20b"                # Ollama model to pre-pull on first launch
#   persistent_model_storage: false     # true = S3 bucket created; models survive cdk destroy
#   s3_model_bucket: ""                 # name of existing bucket to reuse (from prior deploy output)
#   allowed_cidr: ""                    # leave empty to auto-detect deployer IP; or set AWS_ALLOWED_CIDR in .env

paths:
  exports_dir: "data/exports"
  theme_maps_dir: "data/theme-maps"
  taxonomy_drafts_dir: "data/taxonomy-drafts"
  proposals_dir: "data/proposals"
  dedup_proposals_dir: "data/dedup-proposals"
  reports_dir: "data/reports"
  logs_dir: "data/logs"           # run logs - one JSON file per command execution

export:
  include_body: true
  max_body_chars: 2000        # Truncate long notes for classification
  skip_empty: true
  primary_account: ""         # Export only notes from this Apple Notes account (e.g. "iCloud").
                              # Leave empty to export from all accounts.

classify:
  exclude_archive: true   # Skip Archive notes during classification (added to no_change automatically)
                          # Set to false to include Archive notes in a full library re-organization

deduplication:
  fuzzy_title_threshold: 85      # thefuzz token_sort_ratio threshold (0-100)
  jaccard_content_threshold: 80  # thefuzz token_set_ratio threshold (0-100)
  content_preview_chars: 300     # characters of each note shown in the dedup proposal
  semantic_sweep: false          # full LLM pass over theme clusters (expensive; off by default)
  default_resolution: "review"   # conservative default: flag for human, don't auto-delete

thresholds:
  min_notes_for_subfolder: 8     # minimum note count before a NEW subfolder is proposed (discover/draft)
                                  # folders that already exist in your library are always honoured regardless
                                  # of this value - the threshold only gates creation of new structure
                                  # audit uses this inversely: flat folders ABOVE this count -> subfolder candidate
                                  # (subfolder candidate check is suppressed when reorganization_mode: conservative)
  min_notes_for_hub: 1           # minimum notes for a subfolder to get its own Hub note in sync-hubs
  min_notes_for_home_link: 1    # minimum notes for a subfolder to appear on the ✱ Home note
                                  # set to 1 so every folder with any notes is navigable from Home;
                                  # subfolders below min_notes_for_hub appear as plain text (no Hub
                                  # note to link to) and gain a Hub once they cross that threshold
  max_folder_depth: 3            # absolute ceiling on proposed nesting (Apple Notes max: 5)
  stub_words: 5                  # notes with <= this many combined title+body words AND no attachments -> flag as stub

# Per-category metadata - controls classifier behaviour and audit checks.
# Any key you define in taxonomy.local.yaml can have an entry here.
# Keys not listed here inherit defaults from the nine built-in roles (see config.py).
#
# Supported flags (all optional):
#   description           - text sent to the LLM alongside the folder name during classification
#   transit: true         - conservative mode: notes here are "in-flight" and may be freely moved
#   stale_days: N         - audit: flag notes not modified within N days
#   active_days: N        - audit: flag notes not modified FOR N days (e.g. inactive projects)
#   exclude_from_classify - skip notes in this folder during `notes classify`
#   exclude_from_discover - skip notes in this folder during `notes discover`
#   catchall: true        - route notes the LLM cannot confidently classify here
#
# Example for a PARA taxonomy (see also config/taxonomy.para.yaml):
#   inbox:
#     description: "capture - unprocessed notes to be filed"
#     transit: true
#     stale_days: 7
#   projects:
#     description: "active projects with a defined outcome"
#     active_days: 90
#   areas:
#     description: "ongoing responsibilities without an end date"
#   resources:
#     description: "reference material on topics of interest"
#   archive:
#     description: "inactive, completed, or outdated items"
#     exclude_from_classify: true
#     exclude_from_discover: true
#
# Example for a GTD taxonomy:
#   capture:
#     description: "unprocessed inputs"
#     transit: true
#     stale_days: 3
#   someday_maybe:
#     description: "deferred ideas and projects"
#   reference:
#     exclude_from_classify: true
categories:
  inbox:
    description: "temporary capture"
    transit: true
    stale_days: 7
  fleeting:
    description: "quick, short-lived thoughts"
    transit: true
    stale_days: 30
  literature:
    description: "notes tied to a specific source (book, article, talk)"
  permanent:
    description: "refined, evergreen concepts in your own words"
  projects:
    description: "notes tied to active projects"
    active_days: 90
  areas:
    description: "ongoing responsibilities"
  resources:
    description: "reference material and collections"
  archive:
    description: "inactive, completed, or outdated notes"
    exclude_from_classify: true
    exclude_from_discover: true
  review:
    description: "use when classification is genuinely unclear"
    catchall: true

# Settings below apply only when forever_notes_mode is "strict".
strict_mode:
  heavy_asterisk: "✱"            # Unicode U+2731 - do not change
  home_note_title: "✱ Home"
  home_note_folder: null         # null = iCloud root; or specify a folder name
  hub_title_prefix: "✱ "
  hub_note_folder: null          # null = same folder as home note
  internal_links: "text"         # "text" = plain title list (safe, default)
                                  # "html" = applenotes:// links (experimental - may break
                                  #          after iCloud sync; see docs/forever-notes-framework.md)

  # -- Future / unreleased settings -----------------------------------------
  # These keys are reserved for upcoming features and are NOT yet read by any script.
  # Enabling them now has no effect.
  tag_all_notes: false           # NOT YET IMPLEMENTED - append #ForeverNotes to every classified note
  tag_theme_notes: false         # NOT YET IMPLEMENTED - append #[theme] tag to notes on classification
  tag_hub_notes: false           # NOT YET IMPLEMENTED - append #hub tag to all hub notes
  update_hubs_after_classify: false  # NOT YET IMPLEMENTED - auto-run sync-hubs after classify
