[project]
name = "manage-apple-notes"
version = "0.4.0"
description = "AI-powered Apple Notes organiser — export, classify, deduplicate, and maintain a PARA or Zettelkasten vault from the command line"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jason MacLeod", email = "jason.d.macleod@gmail.com" }]
keywords = ["apple-notes", "macos", "notes", "pkm", "para", "zettelkasten", "ai", "llm", "anthropic", "ollama", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "questionary>=2.0",
    "thefuzz>=0.22",
    "typer>=0.15",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/jdmacleod/manage-apple-notes"
Repository = "https://github.com/jdmacleod/manage-apple-notes"
Issues = "https://github.com/jdmacleod/manage-apple-notes/issues"
Changelog = "https://github.com/jdmacleod/manage-apple-notes/blob/main/CHANGELOG.md"

[project.scripts]
notes = "scripts.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.15.15",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # line length — enforced by formatter, not linter
    "SIM108",  # ternary suggestions — explicit if/else is clearer here
]

[tool.ruff.lint.per-file-ignores]
"scripts/dev_*.py" = ["E402"]   # dev smoke-test scripts import after setup code
"scripts/cli.py" = ["E402"]     # load_dotenv() must run before sub-module imports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=scripts --cov-report=term-missing --cov-report=xml --cov-fail-under=90"
markers = [
    "real_providers: marks tests that call live Apple Intelligence or Ollama (skip in CI; pass --real-providers to run)",
]

[tool.coverage.run]
omit = ["scripts/dev_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "def __repr__",
    'if __name__ == "__main__"',
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
