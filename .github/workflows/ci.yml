name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check scripts/ tests/

      - name: Type check
        run: uv run mypy scripts/
        continue-on-error: true

      - name: Test
        run: uv run pytest

      - name: Generate coverage badge
        run: uv run genbadge coverage -i coverage.xml -o badges/coverage.svg

      - name: Commit coverage badge
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update coverage badge [skip ci]"
          file_pattern: badges/coverage.svg

      - name: Build verification
        run: uv build
